name: Deploy Altyn Khan Modern 3D preview

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0
      - name: Prepare gh-pages worktree
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/pages gh-pages
          rm -rf /tmp/pages/modern-3d
          mkdir -p /tmp/pages/modern-3d
          cp index.html styles.css lms-config.js lms-adapter.js /tmp/pages/modern-3d/
          cp -R src assets /tmp/pages/modern-3d/
          touch /tmp/pages/.nojekyll
      - name: Publish preview
        run: |
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-3d .nojekyll
          git commit -m "Deploy Altyn Khan Modern 3D v0.2.0 preview"
          git push origin gh-pages
