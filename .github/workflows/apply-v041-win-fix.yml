name: Apply Altyn Khan v0.4.1 win fix

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0

      - name: Patch local round-complete event and version
        shell: python
        run: |
          from pathlib import Path

          p = Path('lms-adapter.js')
          s = p.read_text(encoding='utf-8')
          old = """  function emit(type, payload = {}) {\n    if (global.parent && global.parent !== global) {\n      global.parent.postMessage({source:'X2_CHUKO', type, ...payload}, targetOrigin());\n    }\n  }"""
          new = """  function emit(type, payload = {}) {\n    // UI-only listeners inside the game need the final ticket event too.\n    // Parent postMessage remains unchanged for LMS integration.\n    if (type === 'X2_GAME_ROUND_COMPLETE') {\n      global.dispatchEvent(new CustomEvent(type, { detail: payload }));\n    }\n    if (global.parent && global.parent !== global) {\n      global.parent.postMessage({source:'X2_CHUKO', type, ...payload}, targetOrigin());\n    }\n  }"""
          if old not in s:
              raise SystemExit('emit block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8').replace('0.4.0', '0.4.1')
          s = s.replace('tiered wins + KHAN', 'tiered wins fixed + KHAN')
          p.write_text(s, encoding='utf-8')

          p = Path('src/config.js')
          s = p.read_text(encoding='utf-8').replace("version: '0.4.0'", "version: '0.4.1'", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/khan-effects.js')
          s = p.read_text(encoding='utf-8').replace('Modern 3D v0.4.0', 'Modern 3D v0.4.1', 1)
          p.write_text(s, encoding='utf-8')

          Path('BUILD.txt').write_text(
              'ALTYN KHAN Modern 3D build: 0.4.1\n'
              'Base: CHUKO Modern 3D v9 / 0.13.21\n'
              'Stage: ordinary-win effects fixed and amplified\n'
              'Core mechanics: v0.3.2 stable flow retained\n'
              'Ordinary wins: x0.5 / x1 / x3 / x4 / x5 with progressive flash and rings\n'
              'KHAN: separate gold x10 / x15 / x20 finale retained\n'
              'Financial result source: LMS authoritative\n',
              encoding='utf-8'
          )

      - name: Validate v0.4.1
        run: |
          node --check src/win-effects.js
          node --check src/khan-effects.js
          node --check lms-adapter.js
          node --check src/config.js
          node --check src/game.js
          grep -q "X2_ALTYN_BUILD = '0.4.1'" index.html
          grep -q "win-effects.js?v=0.4.1" index.html
          grep -q "dispatchEvent(new CustomEvent(type" lms-adapter.js
          grep -q "rings:4" src/win-effects.js
          grep -q "ticketId ?? d.ticket?.ticketId" src/win-effects.js

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html BUILD.txt src/config.js src/khan-effects.js src/win-effects.js lms-adapter.js
          git commit -m "Fix and amplify ordinary win effects v0.4.1"
          git push origin modern-3d

      - name: Publish preview
        run: |
          rm -rf /tmp/modern3d /tmp/ghpages
          mkdir -p /tmp/modern3d
          cp index.html styles.css lms-config.js lms-adapter.js /tmp/modern3d/
          cp -r src assets /tmp/modern3d/
          git fetch origin gh-pages
          git worktree add /tmp/ghpages origin/gh-pages
          rm -rf /tmp/ghpages/modern-3d
          mkdir -p /tmp/ghpages/modern-3d
          cp -r /tmp/modern3d/. /tmp/ghpages/modern-3d/
          cd /tmp/ghpages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-3d
          git commit -m "Publish Altyn Khan Modern 3D v0.4.1"
          git push origin HEAD:gh-pages
