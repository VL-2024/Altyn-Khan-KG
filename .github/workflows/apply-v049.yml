name: Apply ORDO v0.4.9 cache-busting fix

on:
  push:
    branches: [modern-3d]
    paths:
      - '.github/workflows/apply-v049.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0
      - name: Fix v0.4.9 asset URLs
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '?v=0.4.8' not in s:
              raise SystemExit('Expected v0.4.8 asset URLs not found')
          s = s.replace('?v=0.4.8', '?v=0.4.9')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q "khan-effects.js?v=0.4.9" index.html
          grep -q "win-effects.js?v=0.4.9" index.html
          grep -q "counter-sync.js?v=0.4.9" index.html
          grep -q "styles.css?v=0.4.9" index.html
      - name: Commit cache-busting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix ORDO v0.4.9 asset cache busting"
          git push origin modern-3d
