name: Apply Altyn Khan v0.4.0

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0

      - name: Update build to v0.4.0
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('0.3.2', '0.4.0')
          line = '<script src="src/win-effects.js?v=0.4.0"></script>'
          if line not in s:
              s = s.replace('<script src="src/khan-effects.js?v=0.4.0"></script>', '<script src="src/khan-effects.js?v=0.4.0"></script>\n' + line)
          s = s.replace('ALTYN KHAN v0.4.0 · KHAN scenarios 7–9 · Babylon.js 9.25 + Havok', 'ALTYN KHAN v0.4.0 · tiered wins + KHAN · Babylon.js 9.25 + Havok')
          p.write_text(s, encoding='utf-8')

          p = Path('src/config.js')
          s = p.read_text(encoding='utf-8').replace("version: '0.3.2'", "version: '0.4.0'", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/khan-effects.js')
          s = p.read_text(encoding='utf-8').replace('Modern 3D v0.3.2', 'Modern 3D v0.4.0', 1)
          p.write_text(s, encoding='utf-8')

          Path('BUILD.txt').write_text(
              'ALTYN KHAN Modern 3D build: 0.4.0\n'
              'Base: CHUKO Modern 3D v9 / 0.13.21\n'
              'Stage: tiered ordinary-win visual effects\n'
              'Core mechanics: v0.3.2 stable flow retained\n'
              'Ordinary wins: x0.5 / x1 / x3 / x4 / x5 increase progressively\n'
              'KHAN: separate gold x10 / x15 / x20 finale retained\n'
              'Financial result source: LMS authoritative\n',
              encoding='utf-8'
          )

      - name: Validate v0.4.0
        run: |
          node --check src/win-effects.js
          node --check src/khan-effects.js
          node --check src/config.js
          node --check src/game.js
          grep -q "X2_ALTYN_BUILD = '0.4.0'" index.html
          grep -q "win-effects.js?v=0.4.0" index.html
          grep -q "X2_GAME_ROUND_COMPLETE" src/win-effects.js

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html BUILD.txt src/config.js src/khan-effects.js src/win-effects.js
          git commit -m "Release tiered ordinary win effects v0.4.0"
          git push origin modern-3d

      - name: Publish preview
        run: |
          rm -rf /tmp/modern3d /tmp/ghpages
          mkdir -p /tmp/modern3d
          cp index.html styles.css lms-config.js lms-adapter.js /tmp/modern3d/
          cp -r src assets /tmp/modern3d/
          git fetch origin gh-pages
          git worktree add /tmp/ghpages origin/gh-pages
          rm -rf /tmp/ghpages/modern-3d
          mkdir -p /tmp/ghpages/modern-3d
          cp -r /tmp/modern3d/. /tmp/ghpages/modern-3d/
          cd /tmp/ghpages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-3d
          git commit -m "Publish Altyn Khan Modern 3D v0.4.0"
          git push origin HEAD:gh-pages
