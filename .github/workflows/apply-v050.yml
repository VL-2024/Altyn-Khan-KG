name: Apply ORDO v0.5.0 visual polish

on:
  push:
    branches: [modern-3d]
    paths:
      - '.github/workflows/apply-v050.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0
      - name: Apply v0.5.0 patch
        run: |
          python .github/scripts/apply-v050.py
          node --check src/game.js
          node --check src/config.js
          grep -q "X2_ALTYN_BUILD = '0.5.0'" index.html
          grep -q "version: '0.5.0'" src/config.js
          grep -q "khanModelScale: 1.08" src/game.js
          grep -q "hemi.intensity = 1.00" src/game.js
          grep -q "const neutral = kind === 'chuko'" src/game.js
      - name: Commit v0.5.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD.txt index.html src/config.js src/game.js
          git commit -m "Deploy ORDO v0.5.0 visual polish"
          git push origin modern-3d
