name: Fix initial Altyn Khan title

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0

      - name: Remove CHUKO flash before i18n loads
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'aria-label="3D поле ЧҮКӨ"': 'aria-label="3D поле Алтын Хан"',
              '<div class="game-title-main" data-i18n="title">ЧҮКӨ</div>': '<div class="game-title-main" data-i18n="title">АЛТЫН ХАН</div>',
              '<div class="game-title-sub" data-i18n="subtitle">Выбей Хана</div>': '<div class="game-title-sub" data-i18n="subtitle">Modern 3D</div>',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'marker not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate title shell
        run: |
          grep -q '>АЛТЫН ХАН</div>' index.html
          grep -q '>Modern 3D</div>' index.html
          ! grep -q '>ЧҮКӨ</div>' index.html
          node --check src/i18n.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix initial Altyn Khan title flash"
          git push origin modern-3d

      - name: Publish isolated Modern 3D preview
        run: |
          mkdir -p /tmp/modern3d
          cp index.html styles.css lms-config.js lms-adapter.js /tmp/modern3d/
          cp -r src assets /tmp/modern3d/
          git fetch origin gh-pages
          git worktree add /tmp/ghpages origin/gh-pages
          rm -rf /tmp/ghpages/modern-3d
          mkdir -p /tmp/ghpages/modern-3d
          cp -r /tmp/modern3d/. /tmp/ghpages/modern-3d/
          cd /tmp/ghpages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-3d
          git commit -m "Publish initial title fix"
          git push origin HEAD:gh-pages
