name: Bootstrap Altyn Khan Modern 3D

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d

      - name: Copy locked Chuko v9 / 0.13.21 baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/VL-2024/Chuko-3D.git /tmp/chuko
          cd /tmp/chuko
          git checkout 8c2077b185832b8913709f716fb09be3456617c6
          cd "$GITHUB_WORKSPACE"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/chuko/ ./

      - name: Commit baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start Altyn Khan Modern 3D from Chuko v9 0.13.21"
          git push origin modern-3d
