name: Apply v0.4.6
on:
  push:
    branches: [modern-3d]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v0.4.6
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          v='0.4.6'
          p=Path('index.html'); s=p.read_text()
          s=s.replace('0.4.5',v)
          s=s.replace('ALTYN KHAN v0.4.6 · localized KHAN + X2 LOTO logo · Babylon.js 9.25 + Havok','ORDO v0.4.6 · UI spacing + typography · Babylon.js 9.25 + Havok')
          p.write_text(s)

          p=Path('src/config.js'); s=p.read_text(); s=re.sub(r"version: '0\.4\.\d+'",f"version: '{v}'",s,1); p.write_text(s)

          p=Path('styles.css'); s=p.read_text()
          s=s.replace('position:absolute;z-index:9;left:10%;right:10%;bottom:calc(0.4% + 48px);\n  height:28px;', 'position:absolute;z-index:9;left:10%;right:10%;bottom:calc(0.4% + 45px);\n  height:42px;',1)
          s=s.replace('flex:1;min-width:0;text-align:center;font-size:clamp(14px,3.4vw,18px);font-weight:850;line-height:1.2;', 'flex:1;min-width:0;text-align:center;font-size:clamp(14px,3.4vw,18px);font-weight:850;line-height:1.15;white-space:normal;overflow-wrap:anywhere;',1)
          s=s.replace('position:absolute;left:0;bottom:calc(100% + 8px);width:164px;padding:7px;display:none;', 'position:absolute;left:0;bottom:calc(100% + 8px);width:190px;padding:8px;display:none;',1)
          s=s.replace('width:100%;min-height:36px;padding:7px 9px;border:1px solid rgba(117,163,211,.26);border-radius:10px;\n  background:#183f84;color:#fff;font-size:10px;font-weight:850;line-height:1.15;text-align:left;cursor:pointer', 'width:100%;min-height:42px;padding:9px 11px;border:1px solid rgba(117,163,211,.26);border-radius:10px;\n  background:#183f84;color:#fff;font-size:13px;font-weight:850;line-height:1.18;text-align:left;cursor:pointer',1)
          s=s.replace('.payout-grid-modal .payout-item{min-height:38px;padding:6px 9px;font-size:clamp(11px,2.6vw,15px)}', '.payout-grid-modal .payout-item{min-height:40px;padding:7px 10px;font-size:clamp(13px,3vw,17px)}',1)
          s=s.replace('.ticket-history-id{min-width:0;overflow:visible;white-space:normal;overflow-wrap:anywhere;word-break:break-word;color:#d5deeb;font-size:clamp(9px,2.25vw,13px);font-weight:800;line-height:1.15}', '.ticket-history-id{min-width:0;overflow:visible;white-space:normal;overflow-wrap:anywhere;word-break:break-word;color:#d5deeb;font-size:clamp(11px,2.55vw,14px);font-weight:800;line-height:1.18}',1)
          s=s.replace('.ticket-history-win{color:#dbe63c;font-size:clamp(11px,2.65vw,15px);font-weight:950;white-space:nowrap}', '.ticket-history-win{color:#dbe63c;font-size:clamp(13px,3vw,17px);font-weight:950;white-space:nowrap}',1)
          s=s.replace('.tickets-empty{padding:18px 8px;text-align:center;color:#9dafc5;font-size:clamp(11px,2.45vw,14px)}', '.tickets-empty{padding:18px 8px;text-align:center;color:#9dafc5;font-size:clamp(13px,2.9vw,16px)}',1)
          s=s.replace('.help-step{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;margin:10px 0;font-size:clamp(11px,2.65vw,15px);line-height:1.32}', '.help-step{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;margin:11px 0;font-size:clamp(13px,3vw,17px);line-height:1.34}',1)
          s=s.replace('border:1px solid rgba(211,221,231,.35);background:#23499d;color:#fff;font-weight:900;cursor:pointer', 'border:1px solid rgba(211,221,231,.35);background:#23499d;color:#fff;font-size:14px;font-weight:900;cursor:pointer',1)
          s=s.replace('.score-label{font-size:clamp(8px,1.9vw,11px);color:#b8c6db}', '.score-label{font-size:clamp(10px,2.4vw,14px);font-weight:850;line-height:1.05;color:#b8c6db}',1)
          s=s.replace('.score-value{font-size:clamp(18px,4.5vw,26px);font-weight:950;margin-top:2px;line-height:1}\n.score-value.accent{color:#dbe63c;font-size:clamp(14px,3.8vw,23px);white-space:nowrap}', '.score-value{font-size:clamp(19px,4.7vw,28px);font-weight:950;margin-top:3px;line-height:1;white-space:nowrap}\n.score-value.accent{color:#dbe63c;font-size:clamp(19px,4.7vw,28px);white-space:nowrap}',1)
          s=s.replace('position:absolute;left:8%;right:8%;bottom:calc(0.4% + 64px);height:5.8%;', 'position:absolute;left:8%;right:8%;bottom:calc(0.4% + 92px);height:5.8%;',1)
          # Mobile must preserve the enlarged controls instead of shrinking them back to old sizes.
          s=s.replace('.bottom-tools{left:2.5%;right:2.5%;grid-template-columns:minmax(0,76%) minmax(0,24%)}', '.bottom-tools{left:2.5%;right:2.5%;gap:5px}',1)
          s=s.replace('.bottom-controls{gap:4px}', '.bottom-controls{gap:4px}',1)
          s=s.replace('.mode-switch button{min-width:40px;padding:5px 4px;font-size:10px}', '.mode-switch button{min-width:48px;padding:7px 6px;font-size:12px}',1)
          s=s.replace('.info-btn{min-width:56px;height:30px;padding:0 8px;font-size:11px}', '.info-btn{min-width:66px;height:36px;padding:0 10px;font-size:13px}',1)
          s=s.replace('.audio-toggle{flex-basis:30px;width:30px;height:30px;font-size:15px}', '.audio-toggle{flex-basis:38px;width:38px;height:36px;font-size:19px}',1)
          s=s.replace('.bottom-tools>.ticket-number{font-size:9px;line-height:30px;padding-left:5px}', '.bottom-tools>.ticket-number{font-size:12px;line-height:40px;padding-left:2px}',1)
          p.write_text(s)

          Path('BUILD.txt').write_text('ORDO / ALTYN KHAN 3D build: 0.4.6\nUI: hint has fixed two-line-safe zone with 5px gaps above and below\nInfo menu/modal typography enlarged\nScore labels and values enlarged and normalized across all three cards\nCore mechanics/audio/effects unchanged from v0.4.5\n')
          PY
      - name: Check source
        run: |
          node --check src/config.js
          grep -q "X2_ALTYN_BUILD = '0.4.6'" index.html
          grep -q "bottom:calc(0.4% + 45px)" styles.css
          grep -q "height:42px" styles.css
          grep -q "bottom:calc(0.4% + 92px)" styles.css
          grep -q "font-size:13px;font-weight:850" styles.css
          grep -q "score-label{font-size:clamp(10px,2.4vw,14px)" styles.css
          grep -q "score-value.accent{color:#dbe63c;font-size:clamp(19px,4.7vw,28px)" styles.css
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css src/config.js BUILD.txt
          git commit -m "ORDO v0.4.6 spacing and typography"
          git push origin modern-3d
      - name: Deploy preview
        run: |
          git worktree add /tmp/gh origin/gh-pages
          rm -rf /tmp/gh/modern-3d
          mkdir -p /tmp/gh/modern-3d
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/gh/modern-3d/
          cd /tmp/gh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-3d
          git commit -m "Deploy ORDO v0.4.6"
          git push origin HEAD:gh-pages
      - name: Build archive
        run: zip -qr /tmp/ordo-altyn-khan-3d-v0.4.6.zip . -x '.git/*' '.github/*'
      - uses: actions/upload-artifact@v4
        with:
          name: ordo-altyn-khan-3d-v0.4.6
          path: /tmp/ordo-altyn-khan-3d-v0.4.6.zip
          retention-days: 30
