name: Apply Altyn Khan multi-throw patch

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
      - name: Apply patch
        run: python tools/patch_multithrow.py
      - name: Validate JavaScript
        run: |
          node --check src/game.js
          node --check src/config.js
          node --check src/scenario-config.js
          node --check src/altyn-scenario-controller.js
          node --check lms-adapter.js
          grep -q "resolveCurrentAltynThrow" src/game.js
          grep -q "positions.slice(0, C.pile.chukoCount)" src/game.js
          grep -q "ALTYN KHAN Modern 3D build: 0.2.0" BUILD.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js src/config.js index.html BUILD.txt
          git commit -m "Implement Altyn Khan 1-3 throw round controller"
          git push origin modern-3d
