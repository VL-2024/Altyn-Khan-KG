name: Altyn Khan Modern 3D stage 1 patch

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
      - name: Patch shell and demo selector
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>ЧҮКӨ Modern 3D — LMS/scenarios 0.13</title>', '<title>АЛТЫН ХАН Modern 3D — v0.1</title>')
          s = s.replace('0.13.21', '0.1.0')
          s = s.replace('window.X2_CHUKO_BUILD', 'window.X2_ALTYN_BUILD')
          s = s.replace('v0.1.0 · Babylon.js 9.25 + Havok · LMS UI из v20.61', 'ALTYN KHAN v0.1.0 · Babylon.js 9.25 + Havok · base CHUKO v9')
          marker = '<script src="src/scenario-config.js?v=0.1.0"></script>'
          extra = marker + '\n<script src="src/altyn-scenario-controller.js?v=0.1.0"></script>'
          if 'altyn-scenario-controller.js' not in s:
              s = s.replace(marker, extra)
          p.write_text(s, encoding='utf-8')

          p = Path('lms-adapter.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "const item = forcedItem || scenarioCfg.randomDemo();",
              "const item = forcedItem || scenarioCfg.demoAt(mockCounter++);"
          )
          s = s.replace(
              '// DEMO: every new demo ticket gets an independent weighted-random scenario.\n    // ?scenario=... remains an explicit QA override and bypasses randomness.',
              '// ALTYN KHAN DEMO: preserve the showcase sequence 1→2→1→3→...→9.\n    // ?scenario=... remains an explicit QA override.'
          )
          p.write_text(s, encoding='utf-8')
      - name: Commit stage 1 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lms-adapter.js
          git commit -m "Wire Altyn Khan scenario controller into Modern 3D shell"
          git push origin modern-3d
