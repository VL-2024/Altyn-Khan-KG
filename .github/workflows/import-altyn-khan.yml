name: Import Altyn Khan package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy standalone game package
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/VL-2024/Superloto-KG/gh-pages/altyn-khan"
          curl -fsSL "$BASE/index.html" -o index.html
          curl -fsSL "$BASE/config.js" -o config.js
          curl -fsSL "$BASE/lms-adapter.js" -o lms-adapter.js
          curl -fsSL "$BASE/iframe-host-example.html" -o iframe-host-example.html
          curl -fsSL "$BASE/INTEGRATION.md" -o INTEGRATION.md
          curl -fsSL "$BASE/README.txt" -o README.txt
          mkdir -p assets
          curl -fsSL "$BASE/assets/background.webp" -o assets/background.webp
          for kind in chuko saka khan; do
            for i in 1 2 3 4 5 6; do
              curl -fsSL "$BASE/assets/${kind}-${i}.webp" -o "assets/${kind}-${i}.webp"
            done
          done

      - name: Commit imported package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html config.js lms-adapter.js iframe-host-example.html INTEGRATION.md README.txt assets/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Import standalone Altyn Khan game package"
          git push
