name: Polish Altyn Khan between-throw transition

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0

      - name: Apply transition patch
        run: python tools/step2_transition.py

      - name: Validate JavaScript and transition wiring
        run: |
          node --check src/game.js
          node --check src/config.js
          node --check src/i18n.js
          grep -q "transitionToNextAltynThrow" src/game.js
          grep -q "case 'transition'" src/game.js
          grep -q "hintThrowProgress" src/i18n.js
          grep -q "RU:'Бросок'" src/i18n.js
          grep -q "betweenThrowPauseMs: 320" src/config.js
          grep -q "ALTYN KHAN Modern 3D build: 0.2.1" BUILD.txt

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.js src/config.js src/i18n.js styles.css index.html BUILD.txt
          git commit -m "Polish Altyn Khan between-throw transition"
          git push origin modern-3d

      - name: Publish isolated Modern 3D preview
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/pages gh-pages
          rm -rf /tmp/pages/modern-3d
          mkdir -p /tmp/pages/modern-3d
          cp index.html styles.css lms-config.js lms-adapter.js /tmp/pages/modern-3d/
          cp -R src assets /tmp/pages/modern-3d/
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-3d .nojekyll
          git commit -m "Deploy Altyn Khan Modern 3D v0.2.1 preview"
          git push origin gh-pages
