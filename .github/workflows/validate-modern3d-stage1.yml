name: Apply ORDO v0.5.1 Android visual profile

on:
  push:
    branches: [modern-3d]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-3d
          fetch-depth: 0
      - name: Apply Android visual patch
        run: python .github/scripts/apply-v051.py
      - name: Verify source
        run: |
          node --check src/game.js
          node --check src/config.js
          grep -q "X2_ALTYN_BUILD = '0.5.1'" index.html
          grep -q "version: '0.5.1'" src/config.js
          grep -q "ANDROID_VISUAL_BOOST" src/game.js
          grep -q "android-fill" src/game.js
          grep -q "khanModelScale: 1.08" src/game.js
      - name: Commit v0.5.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD.txt index.html src/config.js src/game.js
          git commit -m "Deploy ORDO v0.5.1 Android visual profile"
          git push origin modern-3d
