name: Validate Altyn Khan Modern 3D

on:
  push:
    branches: [modern-3d]

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check src/config.js
          node --check src/scenario-config.js
          node --check src/altyn-scenario-controller.js
          node --check src/khan-effects.js
          node --check src/win-effects.js
          node --check src/counter-sync.js
          node --check lms-adapter.js
          node --check lms-config.js
          node --check src/i18n.js
          node --check src/game.js
      - name: Verify build version is consistent across all files
        # Self-consistency instead of a hardcoded literal - the previous
        # version of this step asserted an exact string ('0.5.1') that was
        # already 10+ releases stale (this repo is at 0.5.11+ now) and had
        # been silently red since whenever the last bump to that literal
        # was missed. A check that reads the current build number from
        # index.html and asserts every other reference matches it instead
        # of a number this file has to be manually kept in sync with can't
        # go stale the same way - it fails only on a genuine forgot-to-bump
        # mistake, in any future version, not just the one hardcoded today.
        run: |
          BUILD=$(grep -oP "X2_ALTYN_BUILD = '\K[^']+" index.html)
          echo "Detected build version: $BUILD"
          test -n "$BUILD"
          grep -q "u.searchParams.get('build') !== '$BUILD'" index.html
          for f in styles.css assets/preloader-logo.webp src/config.js lms-config.js src/scenario-config.js src/altyn-scenario-controller.js lms-adapter.js src/i18n.js src/game.js src/khan-effects.js src/win-effects.js src/counter-sync.js; do
            grep -qF "${f}?v=$BUILD" index.html || { echo "::error::cache-busting query string for $f does not match build $BUILD"; exit 1; }
          done
          grep -qF "version: '$BUILD'" src/config.js || { echo "::error::src/config.js CONFIG.version out of sync with build $BUILD"; exit 1; }
      - name: Verify game wiring
        run: |
          grep -q "procedural KHAN proxy" src/game.js
          grep -q "RU:'ОРДО'" src/i18n.js
          grep -q "АЛТЫН ХАН 3D" src/i18n.js
          grep -q "khanPopup" src/i18n.js
          grep -q "throw: 'assets/sounds/impact-chuko.mp3'" lms-config.js
          grep -q "impact: 'assets/sounds/throw-whoosh.mp3'" lms-config.js
          grep -q "chukoCount: 11" src/config.js
          grep -q "resolveCurrentAltynThrow" src/game.js
          grep -q "resetSakaForNextAltynThrow" src/game.js
          grep -q "X2_GAME_THROW_COMPLETE" src/game.js
          grep -q "X2_GAME_ROUND_COMPLETE" src/win-effects.js
          grep -q "X2_ALTYN_NORMAL_WIN_OUT" src/win-effects.js
          grep -q "X2_ALTYN_KHAN_OUT" src/khan-effects.js
          grep -q "X2_ALTYN_KHAN_OUT" src/counter-sync.js
      - name: Scenario planner tests
        run: |
          node <<'NODE'
          global.window = global;
          require('./src/scenario-config.js');
          require('./src/altyn-scenario-controller.js');
          const C = global.X2AltynScenarioController;
          const S = global.X2AltynScenarioConfig;
          for (let id = 1; id <= 9; id++) {
            for (let n = 0; n < 100; n++) {
              const ticket = `QA-${id}-${n}`;
              const a = C.buildPlan(ticket, id);
              const b = C.buildPlan(ticket, id);
              if (!C.validatePlan(a)) throw new Error(`invalid plan ${id}/${n}`);
              if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`non-deterministic ${id}/${n}`);
              const item = S.get(id);
              if (item.khan && a.throws[a.throws.length - 1].index !== item.khanThrow) throw new Error(`wrong khan throw ${id}`);
              if (item.khan && !a.throws[a.throws.length - 1].khanOut) throw new Error(`missing khan ${id}`);
              if (!item.khan && a.throws.length !== 3) throw new Error(`ordinary scenario not 3 throws ${id}`);
            }
          }
          console.log('Scenario planner QA passed');
          NODE
